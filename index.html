<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aryan Gautam | Gautam City</title>
<meta name="description" content="Aryan Gautam — UCSB Computer Engineering student building rocket avionics, particle detectors, CPUs, and AI systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--navy-dark:#0e1830;--navy:#152447;--navy-2:#1f3263;--gold:#b8913a;--ink:#18213a;--muted:#5d6679;--faint:#8a93a6;--line:#e1e6ef;--paper:#fff;--tint:#f3f7fd;--f-serif:"Playfair Display",Georgia,serif;--f-sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;--wrap:1180px;--gutter:clamp(18px,4vw,32px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gutter)}

/* Top bar */
.topbar{background:var(--navy-dark);color:#aab3c6;font-size:13px;letter-spacing:1.2px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:42px;flex-wrap:wrap}
.topbar .places{display:flex;align-items:center;gap:12px;text-transform:uppercase;flex-wrap:wrap}
.topbar .places svg{width:13px;height:13px;fill:var(--gold)}
.topbar .dot{color:#5f6a83}
.topbar .mail{letter-spacing:.3px;display:inline-flex;align-items:center;gap:7px}
.topbar .mail svg{width:14px;height:14px;stroke:#aab3c6;fill:none;stroke-width:1.6}
.topbar .mail:hover{color:#fff}

/* Nav */
.nav{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:88px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand .name{font-family:var(--f-serif);font-weight:500;font-size:30px;letter-spacing:2.5px;color:var(--navy);font-variant:small-caps}
.brand .sub{font-size:10.5px;letter-spacing:2.6px;color:var(--muted);margin-top:8px;text-transform:uppercase}
.menu{display:flex;gap:clamp(14px,2.2vw,30px);flex-wrap:wrap;align-items:center}
.menu a{font-size:13.5px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;padding:6px 0;border-bottom:2px solid transparent}
.menu a:hover,.menu a.active{color:var(--navy);border-bottom-color:var(--navy)}
.menu a.cv{background:var(--navy);color:#fff;padding:8px 14px;border-radius:3px;border:0}
.menu a.cv:hover{background:var(--gold);color:#fff}

/* Title band */
.band{background:linear-gradient(180deg,var(--navy) 0%,#182a52 100%);color:#fff;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(700px 360px at 85% 30%,rgba(106,169,216,.18),transparent 70%)}
.band .wrap{position:relative;z-index:1;padding-block:64px 72px}
.crumbs{font-size:14px;color:#b7c0d4;display:flex;gap:10px;flex-wrap:wrap}
.crumbs .here{color:#d7deec}
.band h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(40px,6vw,66px);line-height:1.1;margin:26px 0 16px;letter-spacing:-.5px}
.band h1 em{font-style:italic;color:#d9b968;font-weight:500}
.band .role{font-size:18px;color:#c9d1e2;margin:0}

/* Profile */
.profile .wrap{display:grid;grid-template-columns:320px 1fr;gap:56px;padding-block:88px;align-items:start}
.portrait{margin:0;aspect-ratio:1/1;border-radius:50%;overflow:hidden;position:relative;background:#e2eaf6;border:6px solid #fff;box-shadow:0 0 0 1px var(--line),0 24px 48px -28px rgba(21,36,71,.5);max-width:320px}
.portrait img{width:100%;height:100%;object-fit:cover}
.info{min-width:0}
.kicker{font-size:12.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--navy-2);margin:0}
.profile h2{font-family:var(--f-serif);font-weight:600;font-size:clamp(34px,4vw,46px);color:var(--navy);margin:14px 0 6px;line-height:1.15}
.lede{font-size:19px;color:var(--muted);margin:0;max-width:62ch}
.profile .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.pbtn{display:inline-block;padding:11px 18px;font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;border-radius:3px;border:1px solid var(--navy);color:var(--navy)}
.pbtn.solid{background:var(--navy);color:#fff}
.pbtn:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 40px;border-left:3px solid var(--gold);padding:10px 0 10px 30px;margin:40px 0 46px}
.stat .num{font-family:var(--f-serif);font-weight:600;font-size:32px;color:var(--navy);line-height:1.1}
.stat .cap{font-size:13.5px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.about h3{font-size:19px;font-weight:600;margin:0 0 14px}
.about p{margin:0 0 16px;font-size:17px;color:#333b4f}

/* Sections */
section.block{padding-block:clamp(72px,9vw,104px)}
section.tint{background:var(--tint);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.head{margin-bottom:44px;max-width:760px}
.head h2{font-family:var(--f-serif);font-weight:600;font-size:clamp(32px,4vw,42px);color:var(--navy);margin:12px 0 10px;line-height:1.15}
.head p{color:var(--muted);font-size:17px;margin:0}
.rule{width:56px;height:3px;background:var(--gold);margin-top:18px}

/* Photo slots */
.shot{margin:0;position:relative;overflow:hidden;background:#e9eef7;aspect-ratio:4/3;border-radius:6px}
.shot img{width:100%;height:100%;object-fit:cover}
.ph{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:16px;background:linear-gradient(160deg,#e9eef7,#dbe4f2);font-size:13px;color:var(--muted);text-align:center}
.ph svg{width:34px;height:34px;stroke:var(--navy-2);fill:none;stroke-width:1.4}
.ph code{font-size:12px;color:var(--navy);background:#fff;padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.empty .ph{display:flex}

/* Gallery */
.gallery{display:grid;gap:10px;min-width:0}
.gallery .shot{border:1px solid var(--line)}
.gallery .shot>a{display:block;width:100%;height:100%}
.gallery .main{aspect-ratio:16/11}
.gallery .thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gallery .thumbs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.gallery .thumbs .shot{aspect-ratio:1/1}
.gallery .thumbs .wide{grid-column:span 2;aspect-ratio:auto}
.gallery .thumbs .full{grid-column:1/-1;aspect-ratio:1600/493;background:#fff}
.gallery .thumbs .full img{object-fit:contain}
.gallery .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 6px;font-size:11.5px;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgba(14,24,48,.82))}
.gallery .zoom{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:3px;padding:3px 8px}
.gallery .shot.empty .cap,.gallery .shot.empty .zoom{display:none}

/* Featured projects */
.featured{display:grid;gap:28px}
.feature{display:grid;grid-template-columns:1fr 1.1fr;gap:44px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:28px}
.feature .body{min-width:0}
.feature h3{font-family:var(--f-serif);font-weight:600;font-size:clamp(25px,2.6vw,30px);color:var(--navy);margin:10px 0 12px;line-height:1.2}
.feature p{color:var(--muted);margin:0 0 16px}
.points{list-style:none;margin:0 0 20px;padding:0 0 0 20px;border-left:2px solid var(--gold);display:grid;gap:6px}
.points li{font-size:15.5px;color:#333b4f}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:11.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy-2);border:1px solid #cdd6e6;border-radius:3px;padding:4px 9px}
.feature .link,.link{display:inline-block;margin-top:18px;font-size:13.5px;font-weight:600;color:var(--navy)}
.link:hover{color:var(--gold)}
.feature .cta{display:inline-block;margin-top:20px;padding:11px 18px;font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:3px}
.feature .cta:hover{background:var(--gold)}
.feature.solo{grid-template-columns:1fr}
.feature.solo .body{max-width:760px}

/* Cards */
.more{font-size:12.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--navy-2);margin:72px 0 22px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 16px 22px;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 18px 36px -24px rgba(21,36,71,.45);transform:translateY(-2px)}
.card .shot{aspect-ratio:16/9;border:1px solid var(--line)}
.card .shot.top img{object-position:top}
.card h3{font-family:var(--f-serif);font-weight:600;font-size:21px;color:var(--navy);margin:4px 0 0;line-height:1.25}
.card p{color:var(--muted);font-size:15px;margin:0;flex:1}
.card .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px}
.card .foot a{color:var(--navy);font-weight:600}
.card .foot a:hover{color:var(--gold)}

/* Research */
.paper{display:grid;grid-template-columns:130px 1fr auto;gap:28px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start}
.paper:first-child{border-top:1px solid var(--line)}
.paper .date{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);padding-top:4px}
.paper h3{font-family:var(--f-serif);font-weight:600;font-size:22px;color:var(--navy);margin:0 0 8px;line-height:1.3}
.paper h3 a:hover{color:var(--gold)}
.paper p{color:var(--muted);margin:0;max-width:72ch}
.paper .venue{font-style:italic;color:var(--ink);margin-top:8px;font-size:15px}
.read{color:var(--navy);font-style:normal;font-weight:600}
.read:hover{color:var(--gold)}
.status{font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:5px 11px;border-radius:3px;white-space:nowrap;border:1px solid #cdd6e6;color:var(--muted)}
.status.pub{background:var(--navy);border-color:var(--navy);color:#fff}

/* Conferences */
.confs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}
.conf{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:18px;min-width:0}
.conf .shot{border:1px solid var(--line);background:#fff}
.conf .shot>a{display:block;width:100%;height:100%}
.conf .shot.poster{aspect-ratio:2/3}
.conf .shot.poster img{object-fit:contain;background:#0f2c6b}
.conf .shot.slides{aspect-ratio:1430/810}
.conf .shot.logo{aspect-ratio:1320/700;border:0}
.conf .shot.logo img{object-fit:contain}
.conf .when{font-size:12.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.conf h3{font-family:var(--f-serif);font-weight:600;font-size:23px;color:var(--navy);margin:6px 0 6px;line-height:1.25}
.conf .org{font-size:14.5px;color:var(--navy-2);font-weight:500;margin:0 0 10px}
.conf p{color:var(--muted);margin:0 0 10px;font-size:15.5px}
.conf .badge{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:3px;padding:4px 9px;margin-bottom:6px}

/* Internships */
.interns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.intern{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:6px;padding:24px;min-width:0}
.intern .when{font-size:12.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.intern h3{font-family:var(--f-serif);font-weight:600;font-size:21px;color:var(--navy);margin:6px 0 2px;line-height:1.3}
.intern .org{font-size:14.5px;color:var(--navy-2);font-weight:500;margin:0 0 12px}
.intern ul{margin:0;padding-left:18px;color:#333b4f;font-size:15px;display:grid;gap:6px}
.intern .award{display:inline-block;margin-top:14px;font-size:11.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:4px 9px}

/* Experience */
.exp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}
.job{padding:26px 0;border-top:1px solid var(--line)}
.job .when{font-size:12.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.job h3{font-family:var(--f-serif);font-weight:600;font-size:21px;color:var(--navy);margin:6px 0 2px}
.job .org{font-size:14.5px;color:var(--navy-2);font-weight:500;margin:0 0 8px}
.job p{color:var(--muted);margin:0;font-size:15.5px}

/* Certifications */
.certs{display:grid;grid-template-columns:1.2fr 1fr;gap:44px;align-items:start}
.cert-main{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:22px}
.cert-main .shot{aspect-ratio:1600/1131;border:1px solid var(--line);background:#fff}
.cert-main .shot>a{display:block;width:100%;height:100%}
.cert-main .shot img{object-fit:contain}
.cert-main h3{font-family:var(--f-serif);font-weight:600;font-size:22px;color:var(--navy);margin:18px 0 4px;line-height:1.3}
.cert-main p{color:var(--muted);margin:0;font-size:15.5px}
.cert-list{list-style:none;margin:0;padding:0}
.cert-list li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.cert-list li:first-child{border-top:1px solid var(--line)}
.cert-list .yr{color:var(--gold);font-weight:600;font-size:13px;letter-spacing:1px;white-space:nowrap}

/* Skills */
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.skillset{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:4px;padding:22px}
.skillset h3{font-size:12.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--navy-2);margin:0 0 14px}
.skillset ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15.5px}

/* Contact */
.contact{background:var(--navy);color:#fff}
.contact .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;padding-block:80px}
.contact .kicker{color:#d9b968}
.contact h2{font-family:var(--f-serif);font-weight:600;font-size:clamp(32px,4vw,44px);margin:14px 0 12px;line-height:1.15}
.contact h2 em{color:#d9b968;font-weight:500}
.contact p{color:#c9d1e2;margin:0;max-width:54ch;font-size:17px}
.contact .email{display:block;margin-top:18px;font-size:15px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-block;padding:13px 22px;font-size:13.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;border:1px solid rgba(255,255,255,.4);border-radius:3px;color:#fff}
.btn:hover{border-color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold)}
footer{background:var(--navy-dark);color:#8f99b0;font-size:13.5px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:26px}

/* Mobile */
@media (max-width:980px){
  .profile .wrap{grid-template-columns:1fr;gap:40px}
  .portrait{max-width:240px}
  .feature{grid-template-columns:1fr;gap:22px;padding:20px}
  .grid,.skills,.interns{grid-template-columns:repeat(2,minmax(0,1fr))}
  .confs,.certs{grid-template-columns:1fr}
  .contact .wrap{grid-template-columns:1fr}
  .btns{justify-content:flex-start}
}
@media (max-width:640px){
  .nav{position:static}
  .topbar .places span:nth-child(n+4){display:none}
  .brand .name{font-size:25px}
  .menu{gap:12px 16px}
  .menu a{font-size:12.5px}
  .stats{grid-template-columns:1fr;gap:22px;padding-left:22px}
  .grid,.skills,.exp,.interns{grid-template-columns:1fr}
  .paper{grid-template-columns:1fr;gap:8px}
  .paper .status{justify-self:start}
  .gallery .zoom{display:none}
  .gallery .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
